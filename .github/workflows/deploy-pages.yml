name: Deploy ShortForm Studio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned MediaPipe and Playwright
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Package streaming audio reader
        run: npm run vendor:audio
      - name: Package local MediaPipe JavaScript, WASM and face model
        run: npm run vendor:faces
      - name: Validate bundled media engine
        run: |
          test -s vendor/mediapipe/vision_bundle.mjs
          test -s vendor/mediapipe/wasm/vision_wasm_internal.wasm
          test -s vendor/mediapipe/models/blaze_face_short_range.tflite
          test -s vendor/mediabunny/mediabunny.mjs
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html icon.svg manifest.webmanifest sw.js _site/
          cp -R src vendor _site/
      - name: Install Chromium for end-to-end face detection test
        run: npx playwright install --with-deps chromium chrome
      - name: Install FFmpeg for browser video smoke test
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
      - name: Generate landscape and portrait test recordings
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=640x360:rate=12 -t 2.5 -an -c:v libvpx -deadline realtime -cpu-used 8 _site/face-test-landscape.webm
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=360x640:rate=12 -t 2.5 -an -c:v libvpx -deadline realtime -cpu-used 8 _site/face-test-portrait.webm
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i sine=frequency=440:sample_rate=48000:duration=5 -c:a libopus -b:a 96k _site/audio-test.webm
      - name: Verify detector with full decoded-video scans in Chromium
        run: npm run smoke:faces
      - name: Verify audio reader decodes bounded WebM windows in Chromium
        run: npm run smoke:audio
      - name: Generate a short motion-and-audio source for MP4 export verification
        run: ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'testsrc2=size=320x180:rate=24:duration=3.5' -f lavfi -i 'sine=frequency=523:sample_rate=48000:duration=3.5' -map 0:v -map 1:a -c:v libvpx -deadline realtime -cpu-used 8 -b:v 350k -c:a libopus -b:a 80k -t 3.5 _site/mp4-test.webm
      - name: Verify favorites, fresh restore, and actual H.264/AAC MP4 output in Chromium
        run: npm run smoke:mp4
      - name: Verify three-hour AI Director discovery and hour filters in Chromium
        run: npm run smoke:director
      - name: Generate long-seek playback test video
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=640x360:rate=12 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 24 -c:v libvpx -b:v 450k -deadline realtime -cpu-used 8 -c:a libopus -b:a 48k _site/playback-test.webm
          ffmpeg -hide_banner -loglevel error -y -i _site/playback-test.webm -c copy -metadata comment=alternate-source-for-relink-test _site/renamed-playback-test.webm
      - name: Verify relinking, distant seeks, and decoded-frame playback in Chromium
        run: npm run smoke:playback
      - name: Generate sample PvP gameplay with distinct loud combat-like audio bursts
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'testsrc2=size=480x270:rate=10:duration=80' -f lavfi -i 'sine=frequency=200:sample_rate=48000:duration=80' -f lavfi -i 'anoisesrc=color=white:amplitude=0.55:sample_rate=48000:duration=9' -f lavfi -i 'anoisesrc=color=white:amplitude=0.65:sample_rate=48000:duration=9' -filter_complex '[2:a]adelay=9000|9000[a1];[3:a]adelay=51000|51000[a2];[1:a]volume=0.025[base];[base][a1][a2]amix=inputs=3:duration=first:normalize=0[a]' -map 0:v -map '[a]' -c:v libvpx -deadline realtime -cpu-used 8 -b:v 300k -c:a libopus -b:a 40k -t 80 _site/pvp-test.webm
      - name: Verify CoD PvP scan detects real audio/video and preserves action in Chromium
        run: npm run smoke:gameplay
      - name: Generate an actually DIFFERENT playable POV B video for browser tests
        run: ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'testsrc=size=480x270:rate=10:duration=80' -f lavfi -i 'sine=frequency=880:sample_rate=48000:duration=80' -map 0:v -map 1:a -c:v libvpx -deadline realtime -cpu-used 8 -b:v 250k -c:a libopus -b:a 40k -t 80 _site/pov-b-test.webm
      - name: Verify transcript-synchronized multi-POV short creation and playback
        run: npm run smoke:pov
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
