name: Test project
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax and tests
        run: npm run check
      - name: Compile native renderer
        run: python3 -m py_compile tools/render_project.py
      - name: FFmpeg export smoke test
        run: |
          mkdir -p /tmp/studio-tests
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=320x180:rate=24 -f lavfi -i sine=frequency=440 -t 3 -c:v libx264 -c:a aac /tmp/studio-tests/demo.mp4
          python3 - <<'PY'
          import json
          from pathlib import Path
          data={'assets':[{'id':'s','name':'demo.mp4'}],'segments':[{'assetId':'s','start':0,'end':1.4,'speed':1,'zoom':1},{'assetId':'s','start':1.5,'end':2.7,'speed':1,'zoom':1.2}],'words':[],'audio':[],'settings':{'aspect':'9:16','fps':24,'outputHeight':320,'captionOn':False}}
          Path('/tmp/studio-tests/project.json').write_text(json.dumps(data))
          PY
          python3 tools/render_project.py /tmp/studio-tests/project.json --media-dir /tmp/studio-tests --out /tmp/studio-tests/out.mp4
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 /tmp/studio-tests/out.mp4 | grep video
